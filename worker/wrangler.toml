name = "fax-relay"
main = "src/index.js"
compatibility_date = "2026-07-01"

[vars]
PROVIDER = "faxdrop"          # "faxdrop" | "telnyx"
# Comma-separated origin allowlist: only the app itself may call the relay
# from a browser. The access code blocks non-browser (curl) abuse.
ALLOWED_ORIGIN = "https://myfax.pages.dev,https://staging.myfax.pages.dev"

# --- Telnyx only: uncomment when PROVIDER = "telnyx" ---
# TELNYX_CONNECTION_ID = ""
# TELNYX_FROM = "+15550001111"
# MEDIA_PUBLIC_BASE = "https://media.example.com"
#
# [[r2_buckets]]
# binding = "MEDIA"
# bucket_name = "fax-media"

# Secrets — set with `wrangler secret put NAME`, never in this file:
#   FAXDROP_API_KEY
#   TELNYX_API_KEY
#   ACCESS_CODE
