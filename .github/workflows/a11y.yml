name: checks
on:
  push:
  pull_request:
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Computed contrast gate (Doctrine §4 — exits non-zero on any failure)
        run: node tools/contrast-gate.mjs
      - name: Version sync (§7b — one triplet, four carriers)
        run: node tools/version-sync.mjs
      - name: No-grid gate (§2 — run from the hub, never forked)
        run: |
          curl -sSf -o /tmp/docs-check.mjs https://raw.githubusercontent.com/njefferson/noahjefferson/main/docs-check.mjs
          node /tmp/docs-check.mjs .
      - name: Palette gate (§4 — the hub's role model, never forked)
        run: |
          curl -sSf -o /tmp/palette-check.mjs https://raw.githubusercontent.com/njefferson/noahjefferson/main/palette-check.mjs
          node /tmp/palette-check.mjs palettes/myfax.json
      - name: Worker self-test (stubbed provider, no network)
        run: node tools/worker-selftest.mjs
      - name: FaxDrop sandbox smoke (real API, fd_test_ key, no fax sent; skips when secret absent)
        env:
          FAXDROP_TEST_API_KEY: ${{ secrets.FAXDROP_TEST_API_KEY }}
          SENDER_EMAIL: ${{ secrets.SENDER_EMAIL }}
        run: node tools/sandbox-smoke.mjs
